server:
  port: ${PORT:8080}
  compression:
    enabled: true
  shutdown: graceful

spring:
  application:
    name: ecocommute-backend
  threads:
    virtual:
      enabled: true

  datasource:
    # SPRING_DATASOURCE_URL manda; si no, se arma con DB_HOST/DB_PORT/DB_NAME (Render inyecta esas 3).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eco_commute}}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      # Hibernate crea/actualiza el esquema al arrancar (no requiere ejecutar el SQL a mano).
      # database/eco_commute_schema.sql queda como referencia para el ERD.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # Obligatorio: sin el, la aplicacion no arranca (evita el secreto por defecto de jjwt).
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:ecocommute-demo-client.apps.googleusercontent.com}
  openai:
    api-key: ${OPENAI_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  seed-demo-data: ${SEED_DEMO_DATA:true}
