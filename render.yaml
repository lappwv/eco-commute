# Render Blueprint: Full-Stack EcoCommute (Spring Boot 3 Backend + Angular 18 Web App + PostgreSQL 16)
# Activacion: render.com -> New -> Blueprint -> elegir este repo.
services:
  - type: web
    name: ecocommute-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: ecocommute-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecocommute-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ecocommute-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ecocommute-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ecocommute-db
          property: password
      - key: APP_SEED_DEMO_DATA
        value: "true"

  - type: web
    name: ecocommute-frontend
    runtime: static
    buildCommand: cd frontend-angular && npm ci && npm run build
    staticPublishPath: frontend-angular/dist/frontend-angular/browser
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ecocommute-db
    plan: free
    databaseName: eco_commute
