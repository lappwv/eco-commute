<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoCommute Landing Mock-up</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1440px;
      height: 980px;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: #15211f;
      background: #f7fbf9;
    }
    .nav {
      height: 72px;
      border: 1px solid #cfdfda;
      background: rgba(255,255,255,.92);
      display: flex;
      align-items: center;
      padding: 0 54px;
      gap: 32px;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      background: #19a974;
      position: relative;
    }
    .mark::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 18px;
      border-radius: 999px;
      background: #c8f24a;
      right: 8px;
      top: 8px;
    }
    .brand span { font-size: 24px; font-weight: 800; color: #0e6f54; }
    .links { display: flex; gap: 28px; font-size: 14px; font-weight: 700; color: #66736f; }
    .nav button, .cta {
      border: 0;
      border-radius: 8px;
      background: #19a974;
      color: white;
      height: 48px;
      padding: 0 34px;
      font-size: 15px;
      font-weight: 800;
    }
    main { position: relative; height: 908px; padding: 54px; }
    h1 {
      width: 620px;
      margin: 22px 0 0;
      font-size: 56px;
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 900;
    }
    .lead {
      width: 590px;
      margin-top: 28px;
      color: #66736f;
      font-size: 22px;
      line-height: 1.35;
    }
    .actions { display: flex; gap: 20px; margin-top: 24px; }
    .ghost {
      background: white;
      color: #0e6f54;
      border: 1px solid #19a974;
    }
    .map {
      position: absolute;
      right: 120px;
      top: 56px;
      width: 560px;
      height: 430px;
      border-radius: 20px;
      background: #daf7ed;
      border: 1px solid #bdeade;
    }
    .route-h, .route-v {
      position: absolute;
      background: #19a974;
      border-radius: 999px;
    }
    .route-h { width: 360px; height: 8px; left: 76px; top: 222px; }
    .route-v { width: 8px; height: 98px; left: 428px; top: 132px; }
    .pin {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 5px solid white;
      background: #2d63e8;
      left: 60px;
      top: 210px;
    }
    .pin.end { background: #19a974; left: 416px; top: 116px; }
    .kpis {
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 136px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 80px;
    }
    .kpi {
      height: 112px;
      background: white;
      border: 1px solid #cfdfda;
      border-radius: 8px;
      padding: 20px;
    }
    .kpi strong { display: block; color: #0e6f54; font-size: 31px; line-height: 1; }
    .kpi span { display: block; margin-top: 14px; color: #66736f; font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand"><div class="mark"></div><span>EcoCommute</span></div>
    <div class="links"><span>Solución</span><span>Impacto</span><span>Recompensas</span><span>ODS 11</span></div>
    <button>Empezar</button>
  </nav>
  <main>
    <h1>Muévete por Lima y convierte tu impacto en recompensas</h1>
    <p class="lead">EcoCommute recomienda rutas sostenibles, calcula el CO₂ ahorrado y transforma cada viaje en puntos, logros y competencia sana por distrito.</p>
    <div class="actions"><button class="cta">Empieza tu EcoRuta</button><button class="cta ghost">Ver beneficios</button></div>
    <section class="map" aria-label="Ruta sostenible">
      <div class="route-h"></div>
      <div class="route-v"></div>
      <div class="pin"></div>
      <div class="pin end"></div>
    </section>
    <section class="kpis">
      <div class="kpi"><strong>12.8 kg</strong><span>CO₂ ahorrado</span></div>
      <div class="kpi"><strong>420</strong><span>puntos verdes</span></div>
      <div class="kpi"><strong>#3</strong><span>ranking distrital</span></div>
    </section>
  </main>
</body>
</html>
